name: Refresh Finviz snapshot site

# Free, $0-cost refresh loop for docs/ (see scripts/generate_finviz_snapshot_site.py's own
# docstring): runs the generator against the live finviz.com quote page, commits whatever changed
# under docs/data/ back to main, and — with GitHub Pages serving main / docs — that commit is what
# makes the published site show today's numbers. No secrets, no external services beyond
# finviz.com itself.

on:
  schedule:
    # Once daily, ~22:00 UTC (after the US market close) — not a precision requirement, the site
    # itself already discloses "not real-time" (docs/index.html's disclaimer). GitHub often starts
    # scheduled runs 1-3 h late; that's expected.
    - cron: "0 22 * * *"
  workflow_dispatch: {} # manual "Run workflow" button in the Actions tab, for on-demand refreshes

permissions:
  contents: write

# A manual run started while the scheduled one is still going would race it to push — queue
# instead of overlapping (and never cancel a run halfway through writing data).
concurrency:
  group: refresh-finviz-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A normal run takes ~7-8 min; this only stops a hung run from holding the runner for 6 h.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Full editable install (not just httpx/pydantic) — matches local dev exactly, avoids any
      # import-path surprises for the sake of shaving a few CI seconds.
      - name: Install project
        run: pip install -e .

      # Per-ticker problems (a delisted symbol, a transient network error after retries) don't
      # fail this step — they appear as yellow warnings on the run page. It only fails if most
      # tickers fail at once (Finviz blocking/redesign), in which case nothing is committed.
      - name: Generate snapshot JSON
        run: python scripts/generate_finviz_snapshot_site.py

      # Safety net before publishing: the site's own logic tests include one that loads the
      # freshly generated JSON for several tickers and checks every chart cadence and the signal
      # still compute. If the data came out malformed, this step fails and nothing is committed —
      # the live site keeps yesterday's good data instead of breaking.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Validate generated data
        run: node --test "tests/js/*.test.cjs"

      - name: Commit updated snapshot (if anything changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs/data
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
            exit 0
          fi
          git commit -m "Refresh Finviz snapshot data [automated]"
          # Explicit HEAD:main (checkout leaves HEAD detached on schedule/dispatch triggers). If
          # someone pushed to main during the ~7 min this run took, rebase onto it and retry —
          # this run only touches docs/data, so the rebase is conflict-free in practice.
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            echo "Push rejected (attempt $attempt) — rebasing onto the latest main and retrying."
            git pull --rebase origin main
          done
          echo "::error::Could not push the refreshed data after 3 attempts."
          exit 1
