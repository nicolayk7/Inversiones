name: Tests

# Unit tests on every push/PR: Python (pytest, no external services — integration tests are
# excluded by pyproject's addopts) and the site's pure JS logic (docs/js/logic.js via Node's
# built-in test runner, no npm dependencies).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project (with dev extras)
        run: pip install -e ".[dev]"
      - name: pytest (unit)
        run: python -m pytest tests/unit -q

  site-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: node --test (docs/js/logic.js)
        run: node --test "tests/js/*.test.cjs"
