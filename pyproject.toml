[project]
name = "investment-intelligence"
version = "0.1.0"
description = "Investment Intelligence — decision-support platform for wealth and trading analysis. Not a chatbot: deterministic calculation in code, LLM for reasoning/synthesis only."
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "redis>=5.2",
  "pandas>=2.2",
  "numpy>=2.1",
  "pyyaml>=6.0",
  "anthropic>=0.40",
  "alembic>=1.13",
  # Runtime dependency, not dev-only: imported directly by packages/providers/fundamentals/
  # finviz.py, sec_edgar.py, and packages/providers/market/massive.py -- production code, not
  # just tests. Was previously listed under [dev] only, which worked locally (dev venvs install
  # both groups) but broke the GH Actions refresh cron's `pip install -e .` (no [dev] extra):
  # ModuleNotFoundError: No module named 'httpx', confirmed from the actual failed-run log
  # (2026-08-20 22:23 UTC) rather than guessed.
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole session: packages/storage/db.py's async engine is created once at
# import time, so a per-test loop (pytest-asyncio's function-scoped default) would hand an
# async session from a session-scoped fixture to a test body running on a *different* loop.
# Both settings are needed — they scope fixtures and test bodies independently.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-m 'not integration'"
markers = [
  "integration: requires live Postgres/Redis via docker compose (infra/docker-compose.yml)",
]
